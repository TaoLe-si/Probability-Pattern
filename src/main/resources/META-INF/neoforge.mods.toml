modLoader="javafml"
loaderVersion="[1,)"
license="LGPL-3.0"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Tao, ZincG"
description='''
A Minecraft mod that extends Applied Energistics 2 with probabilistic crafting patterns.

Features:
- Statistical Pattern Provider: Encodes processing/crafting patterns with configurable success rates, enabling probabilistic production chains with guaranteed overall confidence.
- Probability Pattern Terminal: A portable terminal for encoding and managing statistical patterns on the go.
- Upgrade Card Support: Compatible with AE2 upgrade cards (e.g. Energy Card) for enhanced functionality.

Designed for complex automation scenarios where crafting outcomes are uncertain, such as ore processing, recycling, or any process with variable yields.
'''
logoFile="assets/statpatterns/textures/logo/probability_pattern_logo.png"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    versionRange="${ae2_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ae2wtlib"
    type="optional"
    versionRange="[19,)"
    ordering="AFTER"
    side="BOTH"