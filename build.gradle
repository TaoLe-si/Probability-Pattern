buildscript {
    repositories {
        mavenLocal()
        mavenCentral()

        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }

        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }

        maven {
            name = "JitPack"
            url = "https://jitpack.io"
        }
    }

    dependencies {
        // GTNH-maintained ForgeGradle 1.2 fork (the upstream one is retired)
        classpath 'com.github.GTNewHorizons:ForgeGradle:1.2.11'
    }
}

apply plugin: 'forge'

// Match the Java level of 1.7.10 mods (ForgeGradle 1.2 uses Java 6/7/8 bytecode)
sourceCompatibility = JavaVersion.VERSION_1_6
targetCompatibility = JavaVersion.VERSION_1_6

version = project.version
group = project.group
archivesBaseName = project.archivesBaseName

def modid = "probabilitypattern"

minecraft {
    version = project.minecraft_version + "-" + project.forge_version
    runDir = "run"

    replaceIn "ProbabilityPatternMod.java"
    replace "@version@", project.version
}

repositories {
    flatDir {
        name = "libs"
        dirs 'libs'
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
    }
    maven {
        name = "JitPack"
        url = "https://jitpack.io"
    }
}

dependencies {
    // Applied Energistics 2 rv3 (1.7.10)
    // Option A: drop the compiled AE2 jar into ./libs (recommended for offline builds)
    compile fileTree(dir: 'libs', include: '*.jar')

    // Option B (alternative): pull a known rv3-beta-6 build from CurseMaven.
    // compile 'curse.maven:ae2-223794:2304403'

    // -- UniMixins (late-phase Mixin support for 1.7.10) --
    def unimixinsVersion = "0.3.1"
    implementation("com.github.LegacyModdingMC.UniMixins:unimixins-all-1.7.10:$unimixinsVersion:dev")
    annotationProcessor("com.github.LegacyModdingMC.UniMixins:unimixins-all-1.7.10:$unimixinsVersion:dev")
}

processResources {
    // Replace tokens in mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft_version
    }

    // Everything else stays as-is
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// -- Mixin (UniMixins) setup --
runClient {
    args("--tweakClass", "org.spongepowered.asm.launch.MixinTweaker")
}

runServer {
    args("--tweakClass", "org.spongepowered.asm.launch.MixinTweaker")
}

def outSrgFile = "${tasks.compileJava.temporaryDir}/outSrg.srg"
def outRefMapFile = "${tasks.compileJava.temporaryDir}/mixins.${modid}.refmap.json"

jar {
    manifest {
        attributes 'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker'
        attributes 'MixinConfigs': "mixins.${modid}.json"
    }

    // Only bundle what belongs to this mod
    include "com/tz/statpatterns/**"
    include "assets/probabilitypattern/**"
    include "mcmod.info"
    include "pack.mcmeta"
    include "mixins.${modid}.json"
    include "mixins.${modid}.late.json"
    include "mixins.${modid}.refmap.json"

    from outRefMapFile
}

tasks.compileJava.options.compilerArgs += [
        "-AreobfSrgFile=${tasks.reobf.srg}",
        "-AoutSrgFile=${outSrgFile}",
        "-AoutRefMapFile=${outRefMapFile}"
]

reobf {
    addExtraSrgFile outSrgFile
}

task deobfJar(type: Jar) {
    from sourceSets.main.output
    classifier = 'deobf'
}

artifacts {
    archives deobfJar
}
