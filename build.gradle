 * ForgeGradle 1.2 fork (the upstream ForgeGradle 1.2 is no longer hosted by
 * MinecraftForge; the GTNH fork is available on JitPack).
 *
 * Crafting interception uses late-phase Mixin provided by UniMixins
 * (com.github.LegacyModdingMC.UniMixins) — the modern Mixin loader for 1.7.10.
 *
 * NOTE: Building this project requires JDK 8 (ForgeGradle 1.2 / MCP 1.7.10 does
 * not work with newer JDKs). See README.md for full build instructions.
