# Human-readable mod name, available for mcmod.info population.
modName = Probability Pattern for AE2

# Case-sensitive identifier string, used for automatic mixin JSON generation.
modId = probabilitypattern

# Root package of the mod.
modGroup = com.tz.statpatterns

# Whether to use modGroup as the maven publishing group.
useModGroupForPublishing = true

# Updates build.gradle / settings.gradle automatically when an update is available.
autoUpdateBuildScript = false

# Version of Minecraft to target
minecraftVersion = 1.7.10

# Version of Minecraft Forge to target
forgeVersion = 10.13.4.1614

# MCP channel + mappings version for the decomp workspace
channel = stable
mappingsVersion = 12

# Default username for testing
developmentEnvironmentUserName = Developer

# Modern Java syntax support.
# false: No modern syntax, Java 8 only (matches AE2 rv3, safest for this port)
enableModernJavaSyntax = false

# ---- local proxy (127.0.0.1:7890) ----
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
